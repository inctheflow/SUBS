[package]
name = "subwatch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "subwatch"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
ratatui = "0.26"
crossterm = "0.27"
printpdf = "0.5"
chrono = { version = "0.4", features = ["clock"] }
